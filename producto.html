<!doctype html>
<html lang="es"><head><meta charset="UTF-8">
<!-- 30-oct · producto.html era una tercera ficha del cuadro. Ya no existe: con parámetros (?type=, ?pared=…) va al editor
     del producto; sin ellos, a la ficha del cuadro. -->
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,follow"/>
<link rel="canonical" href="https://momenturies.com/ficha-cuadro.html"/>
<title>Momenturies</title>
<script>(function(){
  var q = new URLSearchParams(location.search), t = q.get('type'), dest = 'ficha-cuadro.html';
  if(t === 'madera'){ q.delete('type'); dest = 'sobremesa.html'; }
  else if(t === 'nevera'){ q.delete('type'); dest = 'iman.html'; }
  else if(location.search){ q.delete('type'); dest = 'cuadro.html'; }
  var qs = q.toString(); location.replace(dest + (qs && dest !== 'ficha-cuadro.html' ? '?' + qs : '') + location.hash);
})();</script>
<noscript><meta http-equiv="refresh" content="0; url=ficha-cuadro.html"></noscript>
</head><body style="background:#f6f1ea"></body></html>
