<!-- 30-oct · Esta página es SOLO el editor; la ficha del producto es ficha-cuadro.html (la ficha vieja que había aquí se borró).
     El editor se abre solo al entrar y, al salir, se vuelve atrás o a la ficha. Mientras llega editor.js (unos segundos
     en el móvil) se ve una cortina con un aviso. -->
<script>(function(){
  var h = document.documentElement; h.classList.add('ed-entrando');
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(function(){ h.classList.remove('ed-entrando'); }, 50); }); })();</script>
<style>
  html.ed-entrando body{overflow:hidden}
  html.ed-entrando body::before{content:'';position:fixed;inset:0;z-index:2147483000;background:#f6f1ea}
  html.ed-entrando body::after{content:'Abriendo el editor…';position:fixed;left:0;right:0;top:50%;z-index:2147483001;text-align:center;
    font:600 15px/1.4 Inter,system-ui,sans-serif;color:#5b5650;animation:ed-entrando 1.2s ease-in-out infinite alternate}
  @keyframes ed-entrando{from{opacity:.35}to{opacity:1}}
</style>

<script>
/* 30-oct · solo editor: se abre siempre (con pack o sin él) y al cerrarlo (Salir, Esc…) se vuelve a la ficha buena */
(function(){
  var FICHA = 'ficha-cuadro.html', ed = document.getElementById('editor');
  if(!ed) return;
  if(!ed.classList.contains('open')) openEditorWithType(defaultType);
  document.documentElement.classList.remove('ed-entrando');   // el editor ya está abierto: fuera la cortina sin esperar al resto
  var fuera = false;
  new MutationObserver(function(){
    if(fuera || ed.classList.contains('open')) return;
    fuera = true; document.documentElement.classList.add('ed-entrando');
    var r = null; try{ r = document.referrer && new URL(document.referrer); }catch(e){}
    /* si venimos de otra página de la web (portada, ficha…), se vuelve a ella; si no, a la ficha */
    if(r && r.origin === location.origin && !/\/(cuadro|iman|producto)\.html$/.test(r.pathname) && history.length > 1) history.back();
    else location.href = FICHA;
  }).observe(ed, {attributes:true, attributeFilter:['class']});
  /* volviendo con «atrás» desde la página siguiente, el navegador puede devolver esta tal cual: se abre otra vez */
  window.addEventListener('pageshow', function(e){ if(e.persisted){ fuera = false; document.documentElement.classList.remove('ed-entrando'); if(!ed.classList.contains('open')) openEditorWithType(defaultType); } });
})();
</script>
